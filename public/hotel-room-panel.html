<!doctype html><html lang="en-IN"><head>
  <meta name="robots" content="noindex, nofollow" /><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hotel · Scan2Plate</title></head>
<body data-panel-type="Hotel">
<!--
  This page used to redirect every hotel to the cafe token panel — counter
  billing with "Hotel" in the title bar. It now routes by JOB, because a hotel
  has more than one: reception lives in the front desk, housekeeping lives on
  a phone in a corridor, and sending either to the other's screen wastes the
  first thing they do every shift.

  The role comes from the signed-in session, and it is convenience only: what
  each person may actually DO is decided by Firestore rules and by the role
  gates in hotel-housekeeping.js, neither of which can be changed from here.
-->
<script type="module">
  const raw = localStorage.getItem("scan2plate_user") || localStorage.getItem("scan2serve_user") || "{}";
  let role = "";
  try { role = String(JSON.parse(raw)?.role || "").toLowerCase(); } catch { role = ""; }
  const housekeeping = ["housekeeping", "housekeeper", "supervisor"].includes(role);
  const target = housekeeping ? "./hotel-housekeeping.html" : "./hotel-front-desk.html";
  location.replace(target + location.search);
</script>
</body></html>
